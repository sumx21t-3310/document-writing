# チュートリアル（Diátaxis: tutorial）
name: tutorial
title: チュートリアル
category: 説明型
diataxis: tutorial
use_when:
  - 初めて触る人に、手を動かしながら使い方を覚えてもらう
examples:
  - 入門ガイド
  - ハンズオン資料
  - 新メンバー向けの最初の課題
reader:
  who: 対象を初めて使う人
  knows: 前提となる一般的な知識だけ（対象そのものは知らない）
  wants: 最後まで進めて、1つ動くものを作り、自信をつけたい

why:
  question: 読み終えた読み手は何ができるようになるか
  hints:
    - 身につく技能を1〜3個に絞る
    - 次に読むべき文書（how-to や reference）につながる形にする
what:
  question: 最後に何が完成するか
  hints:
    - 完成するものを具体的に書く（画面、動くプログラム、出力）
    - 所要時間の目安を書く
how:
  question: どの順で手を動かせば、つまずかずに完成までたどり着くか
  hints:
    - 1手順ごとに、読み手が結果を目で確かめられるようにする
    - 説明は最小限にし、理由は「あとで説明します」として explanation へ回す
    - 書き手が実際に通して動かした手順だけを載せる

decompose: 時系列で分解する。読み手は全体像を知らないので、作る順に進める
order: 既知から未知へ、時系列

outline:
  - このチュートリアルで作るもの
  - 準備
  - 手順（作る順に小見出しを並べる）
  - 完成したものを動かす
  - 次に読むもの

acceptance:
  - 前提知識だけで最後までたどり着けること
  - 各手順のあとに、読み手が結果を確かめる方法があること
  - 完成するものが冒頭に書かれていること
  - 書き手が通して動かした結果と手順が一致していること

avoid:
  - 選択肢や別解を並べる。迷う箇所を作らない
  - 網羅的な仕様の説明を挟む。必要なら reference へリンクする
  - 動かしていない手順を載せる
