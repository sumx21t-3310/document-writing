# README・リポジトリの紹介文
name: readme
title: README・リポジトリの紹介文
category: 説明型
diataxis: 4分類への入口。長い説明は tutorial・how-to・reference・explanation へ分けてリンクする
use_when:
  - リポジトリ・ライブラリ・ツールを初めて見た人に、何かを伝えて使い始めてもらう
  - 他人のリポジトリを紹介する文章を書く
examples:
  - README.md
  - リポジトリの紹介文
  - ライブラリ・ツールの紹介ページ
reader:
  who: リポジトリを初めて見た人
  knows: 対象の分野の基本。リポジトリそのものは知らない
  wants: 自分の目的に合うかを短時間で判断し、合えば使い始めたい

why:
  question: だれの、どんな困りごとを解決するものか
  hints:
    - 対象を1文で定義する（何で、何ができるか）
    - 想定する利用者を書く
what:
  question: 何ができて、何がまだできないか
  hints:
    - 主な機能を列挙する
    - 似たものとの違いを書く。違いの根拠は一次情報にあるものだけを使う
    - 開発段階（Alpha・Beta・安定版）と、まだ使えない機能を書く
how:
  question: どうやって入れ、どうやって最初に動かすか
  hints:
    - 動作環境と前提を書く
    - インストールの手順を書く
    - 最小の使用例を1つ載せる
    - 詳しい資料（ドキュメントサイト、サンプル）への案内を書く

decompose: 構成要素で分解する。読み手は全体像から入り、自分に要る部分へ進むため
order: 重要なものから（何か → 何ができるか → 入れ方 → 使い方 → 詳しい資料）

outline:
  - 1文の定義
  - 特徴
  - 動作環境
  - インストール
  - 使い方（最小の例）
  - 開発段階と、まだ使えない機能
  - ドキュメント・サンプル
  - ライセンス

acceptance:
  - 冒頭の1文で、何をするものかが分かること
  - 開発段階が書かれていること
  - まだ使えない機能が一次情報にあれば、書かれていること
  - 動作環境・バージョン・機能の一覧が、リポジトリの実物（ソースコード、設定ファイル、リリース）と一致していること
  - 一次情報どうしが食い違ったときは、実物（ソースコード、設定ファイル）を正として書いていること
  - 長い手順・仕様・設計の説明は本文に入れず、リンクで案内していること

avoid:
  - 機能の利点だけを並べ、制約を書かない
  - リポジトリの README を確かめずに、記憶や推測で機能を書く
  - 手順・仕様・設計の説明をすべて1ファイルに詰め込む
