# 手順書（Diátaxis: how-to）
name: how-to
title: 手順書
category: 説明型
diataxis: how-to
use_when:
  - 目的がはっきりしている読み手に、作業の手順を渡す
examples:
  - 作業手順書
  - 環境構築手順
  - 運用手順（リリース、バックアップ、障害対応）
reader:
  who: 作業の目的をすでに持っている人
  knows: 対象のシステムや道具の基本的な使い方
  wants: 迷わずに作業を終え、終わったことを確かめたい

why:
  question: 読み手はこの作業で何を達成したいか
  hints:
    - 作業が終わったあとの状態を1文で書く
    - 「〜するために」の形で書ける目的にする
what:
  question: 作業を始める前に何がそろっていて、終わったら何ができているか
  hints:
    - 前提条件（権限、ツールとバージョン、必要なファイル）を列挙する
    - 完了の状態を、目で確かめられる形で書く（画面の表示、コマンドの出力）
how:
  question: どの順で何を操作するか
  hints:
    - 1手順1操作とする
    - 各手順に、うまくいったときの結果を添える
    - 取り消せない操作の前に、確認の手順を置く

decompose: 時系列で分解する。作業の順番そのものが読み手の目的に合うため
order: 時系列

outline:
  - この手順でできること
  - 前提条件
  - 手順（手順ごとに「手順1: 〜する」の形で小見出しを付ける）
  - 結果を確かめる
  - うまくいかないとき

acceptance:
  - 見出しだけを読んで、作業の目的と手順の数が分かること
  - 前提条件がすべて手順より前に書かれていること
  - 各手順に、成功したときの結果が書かれていること
  - 読み手が手順の途中で別の文書を探さずに済むこと
  - 取り消せない操作の前に確認の手順があること

avoid:
  - 概念や設計判断の長い説明を手順の間に挟む。必要なら explanation へ分けてリンクする
  - 選択肢を並べて読み手に選ばせる。手順書では1つに決めて書く
  - 「適宜」「必要に応じて」で判断を読み手に任せる
