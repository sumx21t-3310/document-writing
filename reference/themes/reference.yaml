# リファレンス（Diátaxis: reference）
name: reference
title: リファレンス
category: 説明型
diataxis: reference
use_when:
  - 作業の途中で、仕様や値を調べに来る読み手に情報を渡す
examples:
  - API リファレンス
  - 設定項目の一覧
  - コマンドのオプション一覧
  - 外部仕様書
reader:
  who: 対象をすでに使っていて、特定の項目を調べに来た人
  knows: 対象の全体像と使い方
  wants: 欲しい項目にすぐたどり着き、正確な値を得たい

why:
  question: 読み手はどんな場面で、何を調べに来るか
  hints:
    - 調べに来る場面を2〜3個挙げ、目次から探せるかを確かめる
what:
  question: 対象はどんな構成要素でできているか
  hints:
    - 構成要素をもれなく列挙する
    - 実物（ソースコード、設定ファイル、スキーマ）から抜き出し、記憶で書かない
how:
  question: 各構成要素を、どの形式で並べると比べやすいか
  hints:
    - すべての項目を同じ形式で書く（名前、型、既定値、説明、例）
    - 項目数が多いときは表にする

decompose: 構成要素で分解する。読み手は全体から部分へたどって探すため
order: 対象の構造の順。構造がないときは名前の順

outline:
  - 概要（対象の範囲）
  - 項目の一覧（構成要素ごとに小見出しまたは表）
  - 共通の決まり（エラー、単位、表記）

acceptance:
  - すべての項目が同じ形式で書かれていること
  - 値・型・既定値が実物と一致していること。確かめられない値には ※要確認 が付いていること
  - 見出しまたは表から、目的の項目にたどり着けること

avoid:
  - 手順や使い方の説明を混ぜる。how-to へ分ける
  - 設計の理由や意見を書く。explanation へ分ける
