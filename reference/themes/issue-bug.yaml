# issue（バグ報告）
name: issue-bug
title: issue（バグ報告）
category: 報告型
use_when:
  - 不具合を見つけ、直す人に再現と調査の材料を渡す
examples:
  - GitHub・GitLab の issue
  - 課題票（チケット）での不具合報告
  - 問い合わせから起こした不具合票
reader:
  who: 不具合を調べて直す開発者。優先度を決める担当者も読む
  knows: システムの構成。報告者の操作や環境は知らない
  wants: 手元で再現し、原因を調べ始めたい。直す優先度を決めたい

why:
  question: だれが、どんな場面で、何に困っているか
  hints:
    - 影響を受ける人と範囲を書く（全ユーザー、特定の画面だけ、など）
    - 回避策があれば書く。優先度の判断材料になる
what:
  question: 期待した動きと、実際の動きはどう違うか
  hints:
    - 期待した動きと実際の動きを、別の項目に分けて書く
    - 実際の動きは、見たままを書く。原因の推測は混ぜない
    - エラーメッセージとスタックトレースは要約せず全文を載せる
how:
  question: どうすれば同じ現象を起こせるか
  hints:
    - 再現手順を、1手順1操作の番号付きで書く
    - 再現した環境を書く（バージョン、OS、ブラウザ、データの条件）
    - 何回試して何回起きたかを書く（例: 5回中5回）
    - 原因の見当があれば、事実と分けて「推測」と書く

decompose: Why・What・How の3つで分解する。What は「期待した動き」と「実際の動き」に分ける
order: 重要なものから（概要 → 期待と実際 → 再現手順 → 環境 → 影響と回避策）

outline:
  - 概要（何が起きるかを1文で）
  - 期待した動き
  - 実際の動き
  - 再現手順
  - 環境
  - 影響範囲と回避策
  - 原因の推測（あれば）
  - ログ・スクリーンショット

acceptance:
  - タイトルだけで、どの機能で何が起きるかが分かること
  - 期待した動きと実際の動きが、別の項目に書かれていること
  - 再現手順に従えば、報告者以外の人が同じ現象を起こせること
  - 再現の頻度が書かれていること。再現できなかった場合はその旨が書かれていること
  - エラーメッセージが全文で載っていること
  - 推測と事実が区別できること
  - 1つの issue に1つの不具合だけが書かれていること

avoid:
  - 「動かない」「おかしい」だけで、何がどう違うかを書かない
  - 原因の推測を事実のように書く
  - 複数の不具合を1つの issue にまとめる
  - 外へ出す issue に、ローカルの絶対パスや個人情報を含むログを貼る
