# 解説（Diátaxis: explanation）
name: explanation
title: 解説
category: 説明型
diataxis: explanation
use_when:
  - 概念・仕組み・設計判断の理由を、読み手に理解してもらう
examples:
  - 設計メモ
  - アーキテクチャの説明
  - 用語や概念の解説
  - 要件定義書の背景の章
reader:
  who: 対象を理解して、自分で判断できるようになりたい人
  knows: 対象の名前や基本的な使い方
  wants: なぜそうなっているかを知り、別の場面でも判断できるようになりたい

why:
  question: 読み手はなぜこれを理解する必要があるか
  hints:
    - 理解していないと起きる困りごとを1つ挙げる
what:
  question: 対象は何で、どんな特徴があるか
  hints:
    - 1文で定義する
    - 似たものとの違いを挙げる
how:
  question: どういう理由や背景で、その形になっているか
  hints:
    - 検討した別案と、選ばなかった理由を書く
    - 決めたことで生じた制約や代償を書く
    - 段落ごとに「言いたいこと＋理由／説明／具体例」で展開する

decompose: 構成要素で分解するか、具体例で分解する。読み手が知りたいのが「仕組み」なら構成要素、「使いどころ」なら具体例
order: 既知から未知へ

outline:
  - 〇〇とは（1文の定義）
  - なぜ〇〇が要るのか
  - 〇〇の仕組み
  - 別案と選ばなかった理由
  - 〇〇の制約

acceptance:
  - 冒頭の1文で対象が定義されていること
  - 設計判断ごとに理由が書かれていること
  - 書き手の意見と事実が区別できること
  - 読み手が知っている話から知らない話へ順に進むこと

avoid:
  - 手順を書く。how-to へ分ける
  - 仕様の値を網羅する。reference へ分ける
  - 領域外の比喩で説明する
