# 報告書
name: report
title: 報告書
category: 報告型
use_when:
  - 作業や調査の結果を、作業を見ていない人に伝える
examples:
  - 作業報告
  - 調査報告
  - 検証結果のまとめ
  - 実装した機能の紹介記事
reader:
  who: 作業を見ていないが、結果をもとに判断する人
  knows: 作業の目的（知らないこともある）
  wants: 結果と、結果を信じてよいかの根拠を短時間で知りたい

why:
  question: なぜその作業・調査が必要だったか
  hints:
    - 作業の前に何が困っていたか、何が分かっていなかったかを書く
what:
  question: 結果はどうだったか。結果から何が言えるか
  hints:
    - 結果と考察を分けて書く
    - 数値・件数は数えて書き、「約」「おそらく」で済ませない
    - 実行しなかった範囲と理由を書く。0件なら「なし」と書く
how:
  question: どうやってその結果を得たか
  hints:
    - 手順・条件・使ったデータを、読み手が再現できる粒度で書く
    - 根拠には出典を添える（ファイル名、実行したコマンドと出力、資料名）

decompose: Why・What・How の3つで分解する。結果を先に置く
order: 重要なものから（結論 → 根拠 → 詳細）

outline:
  - 概要（結論を2〜3文で）
  - 背景
  - 方法
  - 結果
  - 考察
  - 実行しなかった項目
  - 次の作業

acceptance:
  - 冒頭の段落だけで結論が分かること
  - 結果と考察が区別できること
  - すべての数値に出典があること
  - 「実行しなかった項目」の欄があること。0件なら「なし」と書かれていること
  - ローカルの絶対パスを書いていないこと（外へ出す場合）

avoid:
  - 作業の時系列をそのまま並べる。結論から書く
  - 評価語（効率的、大幅に）だけで結果を伝える
