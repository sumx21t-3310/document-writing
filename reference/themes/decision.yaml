# 意思決定の記録（ADR）
name: decision
title: 意思決定の記録（ADR）
category: 報告型・説得型
use_when:
  - 1つの設計判断や方針の決定を、理由と別案ごと残す
  - 決定の承認をレビューで求める（ステータスが proposed のとき）
examples:
  - ADR（Architecture Decision Record）
  - 技術選定の結果の記録
  - 開発の進め方や分担の決定
  - 規約を新しく決めたときの記録
reader:
  who: 後からこの決定に関わる開発者やエージェント（数か月後の書き手を含む）
  knows: プロジェクトの目的と大まかな構成。決めた当時の議論は知らない
  wants: なぜこうなっているかを知り、決定に従うか見直すかを判断したい

why:
  question: 何を決める必要があったか。決めないと何が困ったか
  hints:
    - 決めるきっかけ（issue、障害、要望）を日付つきで書く
    - 当時の制約（期限、人手、既存の依存）を書く
what:
  question: 何を決めたか。何は決めずに残したか
  hints:
    - 決定を「〜する」の形の1文で書く
    - 決定が及ぶ範囲と、後で決めることを書く
how:
  question: なぜその案を選んだか。ほかにどの案があり、選ぶと何が変わるか
  hints:
    - 理由は、決め手になった事実（計測値、制約、決めた人の意向）と結びつけて書く
    - 検討した別案ごとに、選ばなかった理由を書く
    - 決定で得るものと失うものを両方書く
    - 見直す条件が分かっていれば書く
    - 推測で補った理由は、推測だと分かるように書く

decompose: Why・What・How の3つで分解する。How は構成要素（理由、別案、影響）で分解する
order: 時系列（背景 → 決定 → 理由 → 別案 → 影響）。決定そのものはタイトルで先に示す

outline:
  - タイトル（決定を1文で）
  - ステータスと日付（proposed / accepted / superseded / rejected / deprecated）
  - 背景（Context）
  - 決定（Decision）
  - 理由（Reasons）
  - 検討した別案（Alternatives）
  - 影響（Consequences）
  - 関連資料（References）

acceptance:
  - タイトルだけで、何を決めたかが分かること
  - ステータスと決めた日付が書かれていること
  - 1つの文書に、決定が1つだけ書かれていること
  - 背景が、決めた当時の事実（日付、きっかけ、制約）で書かれていること
  - 別案ごとに、選ばなかった理由が書かれていること。別案を検討していなければ、そのことが書かれていること
  - 影響に、得るものと失うものの両方が書かれていること
  - 推測で補った理由に、推測であることが書かれていること

avoid:
  - accepted になった決定の本文を、後から書き換える。決定が変わったら新しい決定を書き、古い決定を superseded にして互いにリンクする
  - 選んだ案の利点だけを書き、失うものを省く
  - 理由を「議論の結果」「総合的に判断して」で済ませる
  - 複数の決定を1つの文書にまとめる
