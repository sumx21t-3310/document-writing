# プルリクエストの本文
name: pull-request
title: プルリクエストの本文
category: 報告型・説得型
use_when:
  - コードの変更をレビューしてもらい、マージの判断を求める
examples:
  - プルリクエスト（PR）の説明
  - マージリクエスト（MR）の説明
reader:
  who: 変更をレビューし、マージを判断する人
  knows: リポジトリの構成。変更の経緯は知らないことが多い
  wants: どこをどう見ればよいかをつかみ、短時間でレビューを終えたい

why:
  question: なぜこの変更が要るか
  hints:
    - 関連する課題票（issue）があればリンクする
    - 変更しないと何が困るかを1〜2文で書く
what:
  question: 何を変えたか。何を変えていないか
  hints:
    - 変更を、レビューする単位（機能・ファイル群）で列挙する
    - 影響範囲と、意図して触らなかった箇所を書く
how:
  question: どうやって正しいと確かめたか。レビューで何を見てほしいか
  hints:
    - テストの実行結果を書く。実行していないなら、していないと書く
    - 手で確かめた手順と結果を書く
    - 判断に迷った箇所を、レビュー観点として挙げる

decompose: Why・What・How の3つで分解する。What はレビューする単位で分解する
order: 重要なものから（概要 → 背景 → 変更内容 → 確認方法 → レビュー観点）

outline:
  - 概要
  - 背景
  - 変更内容
  - 確認方法
  - 影響範囲
  - レビューで見てほしい点

acceptance:
  - 概要だけで、変更の目的と範囲が分かること
  - 確認方法に、実行したテストと結果が書かれていること。未実行ならその旨が書かれていること
  - ローカルの絶対パスを書いていないこと
  - 差分を読めば分かることを言い換えていないこと
  - リポジトリにテンプレートがあれば、その見出しに従っていること

avoid:
  - 作業の経緯を時系列で書く
  - 差分の全文を貼る
