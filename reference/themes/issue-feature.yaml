# issue（機能要望・タスク）
name: issue-feature
title: issue（機能要望・タスク）
category: 説得型
use_when:
  - 新しい機能や改善、作業を提案し、取り組むかどうかの判断を求める
  - 決まった作業を、担当者が着手できる形で書き起こす
examples:
  - GitHub・GitLab の機能要望 issue
  - 課題票（チケット）での作業依頼
  - リファクタリングや調査のタスク
reader:
  who: 取り組むかを判断する人と、作業を担当する人
  knows: システムの構成。要望が出た場面や経緯は知らない
  wants: 取り組む価値があるかを判断したい。担当者は、何をすれば終わりかを知りたい

why:
  question: なぜこれが要るか。今のままだと、だれが何に困るか
  hints:
    - 困っている場面を具体的に書く（だれが、いつ、何をしようとして困るか）
    - 件数や頻度があれば書く
what:
  question: 何をするか。何をしないか。何ができたら終わりか
  hints:
    - 完了の条件を「〜こと」の形で、確かめられるように書く
    - 範囲外のことを書く
how:
  question: どう進めるか。何に関係するか
  hints:
    - 進め方の案があれば書く。決まっていなければ「未定」と書く
    - 関連する issue・PR・資料へのリンクを書く
    - 別案を検討したなら、選ばなかった理由を書く

decompose: Why・What・How の3つで分解する。What は「やること」「やらないこと」「完了の条件」に分ける
order: 重要なものから（概要 → 背景 → やること → 完了の条件 → 進め方）

outline:
  - 概要（何をしたいかを1文で）
  - 背景・困っていること
  - やること
  - やらないこと
  - 完了の条件
  - 進め方の案
  - 関連する issue・資料

acceptance:
  - タイトルだけで、何をする issue かが分かること
  - 背景に、だれが何に困っているかが書かれていること
  - 完了の条件が、終わったかを確かめられる形で書かれていること
  - やらないことが書かれていること。なければ「なし」と書かれていること
  - 1つの issue に1つの目的だけが書かれていること

avoid:
  - 手段（「〇〇ライブラリを入れる」）だけを書き、困りごとを書かない
  - 完了の条件を「いい感じにする」のような評価語で書く
  - 複数の要望を1つの issue にまとめる
