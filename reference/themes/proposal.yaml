# 企画書・提案書
name: proposal
title: 企画書・提案書
category: 説得型
use_when:
  - 読み手に判断や行動を求める
examples:
  - 企画書
  - 提案書
  - 技術選定の提案
  - 移行計画
reader:
  who: 提案を承認するか判断する人
  knows: 組織の目標と現状のおおまかな課題
  wants: 判断に要る材料（効果・費用・リスク）を短時間でそろえたい

why:
  question: なぜその企画が必要か。今のままだと何が困るか
  hints:
    - 課題を数値や事例で示す
    - 課題が誰にとっての困りごとかを書く
what:
  question: 何をするのか。何をしないのか
  hints:
    - 目標を、達成したか確かめられる形で書く
    - 範囲外のことを明記する
how:
  question: 目標をどうやって実現するか
  hints:
    - 主なタスク、スケジュール、体制、費用を書く
    - リスクと対策を組にして書く
    - 検討した別案と、選ばなかった理由を書く

decompose: Why・What・How の3つで分解する。How は構成要素（タスク、スケジュール、体制、費用、リスク）で分解する
order: 重要なものから（求める判断 → 課題 → 目標 → 手段）

outline:
  - 提案の要旨（求める判断を1文で）
  - 課題
  - 目標と範囲
  - 進め方
  - スケジュールと体制
  - 費用
  - リスクと対策
  - 別案との比較

acceptance:
  - 冒頭の1文で、読み手に求める判断が分かること
  - 目標が、達成したか確かめられる形で書かれていること
  - 範囲外のことが書かれていること
  - リスクごとに対策が書かれていること
  - 効果の主張に根拠（数値、事例、出典）があること

avoid:
  - 利点だけを並べ、費用とリスクを省く
  - 判断を求める箇所が文書の末尾にしかない
